name: Tests

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  firewall-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64imac-unknown-none-elf

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run firewall lock unit tests
        working-directory: contracts/firewall-lock
        run: cargo test --features std

      - name: Build firewall lock RISC-V release binary
        working-directory: contracts/firewall-lock
        run: cargo build --release --target=riscv64imac-unknown-none-elf

      - name: Run firewall lock integration tests
        working-directory: tests/unit
        run: cargo test --test firewall_lock_tests

      - name: Build blacklist registry RISC-V release binary
        working-directory: contracts/blacklist-registry
        run: cargo build --release --target=riscv64imac-unknown-none-elf --features dev-signer-keys

      - name: Run blacklist registry integration tests
        working-directory: tests/unit
        run: cargo test --test blacklist_registry_tests

      - name: Install TypeScript SDK deps
        working-directory: sdk/typescript
        run: npm ci

      - name: Typecheck TypeScript SDK
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Run TypeScript SDK tests
        working-directory: sdk/typescript
        run: npm test

      - name: Run phase 3 contract/spec compatibility check
        run: ./scripts/phase3_compat_check.sh

      - name: Validate governance drill artifact (when present)
        if: ${{ hashFiles('tests/integration/governance_drill/latest.json') != '' }}
        run: ./scripts/phase3_governance_drill_check.sh

      - name: Run phase 3 reproducible build manifest
        env:
          MAX_ARTIFACT_SETS: "3"
        run: ./scripts/phase3_repro_build.sh

      - name: Run phase 3 verification script
        env:
          MAX_CYCLES_LOCK_ONLY: "250000"
          MAX_CYCLES_TYPE_ONLY: "250000"
          MAX_CYCLES_BOTH_CHECKS: "300000"
          MAX_CYCLES_LARGE_REGISTRY: "1200000"
          MAX_CYCLES_VERY_LARGE_REGISTRY: "3000000"
          MAX_ARTIFACT_SETS: "3"
        run: ./scripts/phase3_verify.sh

      - name: Upload phase 3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-artifacts
          path: phase3_artifacts/
          retention-days: 14
