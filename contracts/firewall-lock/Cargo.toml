[package]
name = "firewall-lock"
version = "0.1.0"
authors = ["digitaldrreamer", "others"]
edition = "2021"
license = "MIT"
description = "CKB lock script that enforces blacklist checks at consensus layer"

[dependencies]
# * Core CKB script development library
ckb-std = { version = "0.16.4", default-features = false, features = ["ckb-types", "allocator", "dummy-atomic"] }

# * Molecule serialization for data parsing
molecule = { version = "0.8.0", default-features = false }

# * Lightweight error handling
cfg-if = "1.0"

[profile.release]
overflow-checks = true
opt-level = "s"        # * Optimize for size
lto = true            # * Link-time optimization
codegen-units = 1     # * Better optimization at cost of compile time
panic = "abort"       # * Smaller binary size
strip = true          # * Remove debug symbols

[features]
default = []
# * Enable std for testing
std = [
    "molecule/std"
]
# * Declared to satisfy cfg checks used by ckb-std macros in some toolchains
native-simulator = []
