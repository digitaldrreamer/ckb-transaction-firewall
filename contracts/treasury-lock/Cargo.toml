[package]
name = "treasury-lock"
version = "0.1.0"
authors = ["digitaldrreamer", "others"]
edition = "2021"
license = "MIT"
description = "Autonomous treasury lock for CKB firewall governance — allows keyless anchor creation, no private key required"

[dependencies]
ckb-std = { version = "0.16.4", default-features = false, features = ["ckb-types", "allocator", "dummy-atomic"] }
blake2b-ref = { version = "0.3.1", default-features = false }

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
std = []
native-simulator = []
