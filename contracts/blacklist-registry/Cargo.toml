[package]
name = "blacklist-registry"
version = "0.1.0"
authors = ["digitaldrreamer", "others"]
edition = "2021"
license = "MIT"
description = "CKB type script that governs blacklist registry cell updates"

[dependencies]
# * Core CKB script development library
ckb-std = { version = "0.16.4", default-features = false, features = ["ckb-types", "allocator"] }

# * Hashing (pure Rust; avoids C toolchain for RISC-V builds)
blake2b-ref = { version = "0.3.1", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }

# * Molecule serialization (reserved for future use)
molecule = { version = "0.8.0", default-features = false }

# * Lightweight error handling
cfg-if = "1.0"

[profile.release]
overflow-checks = true
opt-level = "s"        # * Optimize for size
lto = true             # * Link-time optimization
codegen-units = 1      # * Better optimization at cost of compile time
panic = "abort"        # * Smaller binary size
strip = true           # * Remove debug symbols

[features]
default = []
# * Enable std for testing
std = [
    "molecule/std"
]
# * Declared to satisfy cfg checks used by ckb-std macros in some toolchains
native-simulator = []
