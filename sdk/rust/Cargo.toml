[package]
name = "ckb-transaction-firewall-sdk"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Off-chain pre-flight blacklist check for CKB transactions"
repository = "https://github.com/digitaldrreamer/ckb-transaction-firewall"
keywords = ["ckb", "nervos", "firewall", "blacklist"]
categories = ["cryptography::cryptocurrencies"]

[lib]
name = "ckb_transaction_firewall_sdk"
path = "src/lib.rs"

[features]
serde = ["dep:serde"]
testnet = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

# Shared BLKL v2 entry decoder — the same implementation the on-chain scripts
# use, so the SDK's pre-flight parsing cannot drift from consensus. The path is
# for in-repo builds; the version lets the crate publish to crates.io once
# registry-format is released.
registry-format = { path = "../../crates/registry-format", version = "0.1" }

[dev-dependencies]
proptest = "1"
